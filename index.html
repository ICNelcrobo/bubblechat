<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>외부이미지 미리보기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#e7eaee;
    --card:#fbfbfc;
    --ink:#14161b;
    --ink-soft:#6f7682;
    --rule:#ccd1d9;
    --pine:#0f6d5f;
    --pine-deep:#0a4d43;
    --oxide:#b23a2f;
    --shadow:0 1px 0 rgba(20,22,27,.06), 0 8px 24px -18px rgba(20,22,27,.5);
    --mono:ui-monospace,SFMono-Regular,"JetBrains Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    --sans:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
    background:var(--paper);
    color:var(--ink);
    font-family:var(--sans);
    font-size:15px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  body[data-lang="ja"]{
    --sans:"Noto Sans JP",-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,system-ui,sans-serif;
    line-height:1.6;
  }
  .wrap{max-width:1180px;margin:0 auto;padding:32px 20px 96px}

  /* ---------- header ---------- */
  .masthead{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;padding-bottom:18px;border-bottom:1.5px solid var(--ink)}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--pine);margin:0 0 6px}
  .masthead h1{margin:0;font-size:27px;font-weight:800;letter-spacing:-.025em}
  .masthead p{margin:6px 0 0;color:var(--ink-soft);font-size:13px;max-width:52ch}

  .langswitch{display:flex;border:1px solid var(--ink);border-radius:2px;overflow:hidden;flex:0 0 auto}
  .langswitch button{background:transparent;color:var(--ink);border:0;border-radius:0;padding:7px 14px;font-size:12.5px;font-weight:600}
  .langswitch button + button{border-left:1px solid var(--ink)}
  .langswitch button[aria-pressed="true"]{background:var(--ink);color:#fff}
  .langswitch button:hover:not([aria-pressed="true"]){background:#dde1e6}

  /* ---------- form ---------- */
  .panel{background:var(--card);border:1px solid var(--rule);border-radius:3px;box-shadow:var(--shadow);margin-top:22px;padding:22px}
  .field{margin-bottom:16px}
  .field:last-of-type{margin-bottom:0}
  .field label{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:6px}
  .field label .opt{font-size:10px;letter-spacing:.06em;color:var(--pine);margin-left:6px}
  .field input{
    width:100%;padding:11px 12px;border:1px solid var(--rule);border-radius:2px;background:#fff;
    font-family:var(--mono);font-size:13.5px;color:var(--ink);
  }
  .field input:focus{outline:2px solid var(--pine);outline-offset:1px;border-color:var(--pine)}
  .hint{margin:6px 0 0;font-size:12px;color:var(--ink-soft)}
  .hint code{font-family:var(--mono);background:#eef0f3;padding:1px 4px;border-radius:2px}
  .hint b{color:var(--ink)}
  .three{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  @media(max-width:820px){.three{grid-template-columns:1fr}}

  .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px;padding-top:18px;border-top:1px dashed var(--rule)}
  button{font-family:var(--sans);font-size:13.5px;font-weight:600;border-radius:2px;cursor:pointer;padding:10px 16px;border:1px solid transparent}
  button:focus-visible{outline:2px solid var(--pine);outline-offset:2px}
  .btn-main{background:var(--pine);color:#fff}
  .btn-main:hover{background:var(--pine-deep)}
  .btn-ghost{background:#fff;color:var(--ink);border-color:var(--rule)}
  .btn-ghost:hover{border-color:var(--ink)}
  .btn-ghost:disabled{color:var(--ink-soft);cursor:not-allowed;border-color:var(--rule);opacity:.6}

  /* ---------- summary ---------- */
  .summary{display:none;margin-top:26px;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
    font-family:var(--mono);font-size:12px;letter-spacing:.04em;color:var(--ink-soft);
    border-top:1.5px solid var(--ink);border-bottom:1px solid var(--rule);padding:10px 2px}
  .summary.on{display:flex}
  .summary b{color:var(--ink);font-weight:700}

  /* ---------- grid ---------- */
  .board{margin-top:24px}
  .section + .section{margin-top:34px}
  .sectionhead{display:flex;align-items:baseline;gap:12px;margin-bottom:12px;padding-bottom:7px;border-bottom:1px solid var(--rule)}
  .sectionhead h3{margin:0;font-size:14px;font-weight:800;letter-spacing:-.01em}
  .sectionhead .meta{font-family:var(--mono);font-size:11px;color:var(--ink-soft);margin-left:auto;white-space:nowrap}
  .grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
  @media(max-width:640px){.grid{gap:10px;grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}}
  .tile{background:var(--card);border:1px solid var(--rule);border-radius:3px;overflow:hidden;box-shadow:var(--shadow);
    display:flex;flex-direction:column;text-align:left;padding:0;transition:border-color .12s ease, transform .12s ease}
  .tile:hover{border-color:var(--ink)}
  .tile.clickable{cursor:pointer}
  .tile.clickable:hover{transform:translateY(-2px)}
  .frame{position:relative;aspect-ratio:1/1;background:
    repeating-linear-gradient(45deg,#eff1f4 0 6px,#e8ebee 6px 12px);
    display:flex;align-items:center;justify-content:center;overflow:hidden}
  .frame img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .2s ease}
  .frame img.shown{opacity:1}
  .frame .gone{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:var(--oxide);
    border:1px dashed var(--oxide);padding:4px 7px;border-radius:2px;background:rgba(255,255,255,.75)}
  .cap{padding:8px 10px;border-top:1px solid var(--rule);display:flex;align-items:center;justify-content:space-between;gap:8px}
  .cap .code{font-family:var(--mono);font-size:12px;font-weight:600;word-break:break-all}
  .cap .n{font-family:var(--mono);font-size:10.5px;color:var(--ink-soft);white-space:nowrap}

  /* ---------- detail ---------- */
  .detailbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
  .detailbar h2{margin:0;font-size:19px;font-weight:800;letter-spacing:-.02em;font-family:var(--mono)}
  .detailbar .tag{font-family:var(--mono);font-size:11px;color:var(--pine);border:1px solid var(--pine);border-radius:2px;padding:2px 7px}

  /* ---------- missing ---------- */
  details.missing{margin-top:30px;background:var(--card);border:1px solid var(--rule);border-left:3px solid var(--oxide);border-radius:3px}
  details.missing summary{cursor:pointer;padding:12px 16px;font-family:var(--mono);font-size:12px;letter-spacing:.05em;color:var(--oxide);font-weight:600}
  details.missing ul{margin:0;padding:0 16px 16px 34px;max-height:280px;overflow:auto}
  details.missing li{font-family:var(--mono);font-size:11.5px;color:var(--ink-soft);word-break:break-all;margin-bottom:4px}

  .empty{margin-top:40px;padding:36px 20px;text-align:center;border:1px dashed var(--rule);border-radius:3px;color:var(--ink-soft);font-size:13.5px}

  /* ---------- lightbox ---------- */
  .light{position:fixed;inset:0;background:rgba(16,18,22,.92);display:none;align-items:center;justify-content:center;flex-direction:column;z-index:50;padding:24px}
  .light.on{display:flex}
  .light img{max-width:min(96vw,1100px);max-height:82vh;object-fit:contain;box-shadow:0 20px 60px -20px #000}
  .light .meta{margin-top:14px;font-family:var(--mono);font-size:12px;color:#c8ccd3;text-align:center;word-break:break-all;max-width:90vw}
  .light nav{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;pointer-events:none}
  .light nav button{pointer-events:auto;background:rgba(255,255,255,.1);color:#fff;border:0;font-size:22px;padding:18px 14px;margin:0 8px;border-radius:2px}
  .light nav button:hover{background:rgba(255,255,255,.22)}
  .light .x{position:absolute;top:16px;right:18px;background:transparent;color:#fff;border:1px solid rgba(255,255,255,.35);font-family:var(--mono);font-size:12px}

  .toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:var(--ink);color:#fff;
    font-family:var(--mono);font-size:12px;padding:10px 16px;border-radius:2px;opacity:0;pointer-events:none;transition:all .18s ease;z-index:60}
  .toast.on{opacity:1;transform:translate(-50%,0)}

  footer{margin-top:56px;padding-top:16px;border-top:1px solid var(--rule);font-size:12px;color:var(--ink-soft)}

  @media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>
<body data-lang="ko">
<div class="wrap">

  <header class="masthead">
    <div>
      <p class="eyebrow">character × outfit × scene</p>
      <h1 data-t="h1"></h1>
      <p data-th="lede"></p>
    </div>
    <div class="langswitch" role="group" aria-label="Language">
      <button type="button" id="langKo" aria-pressed="true">한국어</button>
      <button type="button" id="langJa" aria-pressed="false">日本語</button>
    </div>
  </header>

  <section class="panel">
    <div class="field">
      <label for="tpl" data-t="tplLabel"></label>
      <input id="tpl" type="text" spellcheck="false" data-ph="tplPh">
      <p class="hint" data-th="tplHint"></p>
    </div>

    <div class="three">
      <div class="field">
        <label for="chars" data-t="charLabel"></label>
        <input id="chars" type="text" spellcheck="false" placeholder="1..7, 8..11">
      </div>
      <div class="field">
        <label for="outs"><span data-t="outLabel"></span><span class="opt" data-t="optional"></span></label>
        <input id="outs" type="text" spellcheck="false" data-ph="outPh">
      </div>
      <div class="field">
        <label for="sits" data-t="sitLabel"></label>
        <input id="sits" type="text" spellcheck="false" placeholder="1..21">
      </div>
    </div>
    <p class="hint" style="margin-top:-4px" data-th="codeHint"></p>
    <p class="hint" data-th="groupHint"></p>

    <div class="actions">
      <button class="btn-main" id="run" data-t="run"></button>
      <button class="btn-ghost" id="copy" disabled data-t="copy"></button>
      <button class="btn-ghost" id="dl" disabled data-t="dl"></button>
    </div>
  </section>

  <div class="summary" id="summary"></div>

  <div class="board" id="board"></div>

  <details class="missing" id="missingBox" style="display:none">
    <summary id="missingSummary"></summary>
    <ul id="missingList"></ul>
  </details>

  <footer data-t="footer"></footer>
</div>

<div class="light" id="light" role="dialog" aria-modal="true">
  <button class="x" id="lightClose" data-t="close"></button>
  <img id="lightImg" alt="">
  <div class="meta" id="lightMeta"></div>
  <nav>
    <button id="prev" data-ta="prev">&lsaquo;</button>
    <button id="next" data-ta="next">&rsaquo;</button>
  </nav>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  /* ================= 문구 / テキスト ================= */
  var I18N = {
    ko: {
      docTitle: '외부이미지 미리보기 · 캐릭터/의상/상황',
      h1: '외부이미지 미리보기',
      lede: '템플릿 주소의 <code>캐릭터</code> · <code>의상</code> · <code>상황</code> 자리를 코드로 채워, 실제로 올라간 이미지와 빠진 이미지를 한 번에 확인합니다.',
      tplLabel: '템플릿 URL',
      tplPh: 'https://example.com/assets/캐릭터/의상/상황.webp',
      tplHint: '주소에서 바뀌는 부분을 <code>캐릭터</code>, <code>의상</code>, <code>상황</code> 이라고 그대로 적어주세요. 일본어 표기(<code>キャラクター</code> / <code>衣装</code> / <code>シチュエーション</code>)도 인식합니다.',
      charLabel: '캐릭터 코드',
      outLabel: '의상 코드',
      optional: '없으면 빈칸',
      outPh: '(없으면 비워두세요)',
      sitLabel: '상황 코드',
      codeHint: '코드는 <code>,</code> 로 구분합니다. <code>1..12</code> 처럼 범위를 쓸 수 있고, 자리수(<code>00..30</code>)와 앞글자(<code>E1..17</code>, <code>h/01..20</code>)는 그대로 유지됩니다.',
      groupHint: '<b>그룹 나누기</b> — 캐릭터마다 상황 코드가 다르면 <code>;</code> 로 묶음을 나누고, <code>이름=코드:상황코드</code> 형태로 적습니다. 예: <code>주요=1..7:1..21 ; 기타=8..11:22..26</code> · <code>:</code> 뒤를 생략하면 오른쪽 상황 코드 칸의 값을 씁니다.',
      run: '목록 생성',
      copy: '공유 링크 복사',
      dl: '바로가기 파일 저장',
      emptyStart: '템플릿 주소와 코드를 넣고 목록 생성을 눌러주세요.',
      emptyCodes: '캐릭터 코드와 상황 코드를 모두 넣어주세요.',
      back: '← 목록으로',
      backChar: '← 의상 목록으로',
      gone: '이미지 없음',
      close: '닫기 ESC',
      prev: '이전',
      next: '다음',
      footer: '불러오지 못한 주소는 위 목록에 쌓입니다. 주소 규칙이 틀렸거나, 호스팅에서 외부 도메인 접근을 막았거나, 해당 조합 이미지가 아직 올라가지 않은 경우입니다.',
      groupN: function(n){ return '그룹 ' + n; },
      summary: function(nChar, nGroup, total){
        return '<span>캐릭터 <b>' + nChar + '</b>종' +
               (nGroup > 1 ? ' · 그룹 <b>' + nGroup + '</b>개' : '') +
               ' · 예상 <b>' + total + '</b>장</span>';
      },
      secMeta: function(nChar, nSit){ return nChar + '종 · 상황 ' + nSit + '장'; },
      subSit: function(n){ return n + '장'; },
      subOut: function(o){ return '의상 ' + o + '종'; },
      missing: function(n){ return '없는 이미지 ' + n + '장 (펼치기/접기)'; },
      copied: '링크를 복사했습니다',
      copyFail: '복사에 실패했습니다',
      copyPrompt: '아래 주소를 복사해주세요',
      saved: '바로가기 파일을 저장했습니다'
    },
    ja: {
      docTitle: '外部画像プレビュー · キャラクター/衣装/シチュエーション',
      h1: '外部画像プレビュー',
      lede: 'テンプレートURLの <code>キャラクター</code> · <code>衣装</code> · <code>シチュエーション</code> の部分をコードに置き換えて、実際にアップロードされている画像と抜けている画像をまとめて確認します。',
      tplLabel: 'テンプレート URL',
      tplPh: 'https://example.com/assets/キャラクター/衣装/シチュエーション.webp',
      tplHint: 'URLの中で変わる部分を <code>キャラクター</code>、<code>衣装</code>、<code>シチュエーション</code> とそのまま書いてください。<code>キャラ</code> / <code>シチュ</code> / <code>状況</code> や韓国語表記（<code>캐릭터</code> / <code>의상</code> / <code>상황</code>）も認識します。',
      charLabel: 'キャラクターコード',
      outLabel: '衣装コード',
      optional: '無ければ空欄',
      outPh: '（無ければ空欄のまま）',
      sitLabel: 'シチュエーションコード',
      codeHint: 'コードは <code>,</code> で区切ります。<code>1..12</code> のように範囲で指定でき、桁数（<code>00..30</code>）や先頭の文字（<code>E1..17</code>、<code>h/01..20</code>）はそのまま保たれます。',
      groupHint: '<b>グループ分け</b> — キャラクターごとにシチュエーションコードが違う場合は <code>;</code> でグループを分け、<code>名前=コード:シチュコード</code> の形式で書きます。例：<code>メイン=1..7:1..21 ; サブ=8..11:22..26</code> · <code>:</code> 以降を省略すると右のシチュエーションコード欄の値を使います。',
      run: '一覧を作成',
      copy: '共有リンクをコピー',
      dl: 'ショートカットを保存',
      emptyStart: 'テンプレートURLとコードを入力して「一覧を作成」を押してください。',
      emptyCodes: 'キャラクターコードとシチュエーションコードの両方を入力してください。',
      back: '← 一覧に戻る',
      backChar: '← 衣装一覧に戻る',
      gone: '画像なし',
      close: '閉じる ESC',
      prev: '前へ',
      next: '次へ',
      footer: '読み込めなかったURLは上のリストに記録されます。URLの規則が違う、ホスティング側で外部ドメインからのアクセスを制限している、またはその組み合わせの画像がまだアップロードされていない場合が考えられます。',
      groupN: function(n){ return 'グループ ' + n; },
      summary: function(nChar, nGroup, total){
        return '<span>キャラクター <b>' + nChar + '</b>件' +
               (nGroup > 1 ? ' · グループ <b>' + nGroup + '</b>件' : '') +
               ' · 想定 <b>' + total + '</b>枚</span>';
      },
      secMeta: function(nChar, nSit){ return nChar + '件 · シチュ ' + nSit + '枚'; },
      subSit: function(n){ return n + '枚'; },
      subOut: function(o){ return '衣装 ' + o + '件'; },
      missing: function(n){ return '見つからない画像 ' + n + '枚（開く / 閉じる）'; },
      copied: 'リンクをコピーしました',
      copyFail: 'コピーできませんでした',
      copyPrompt: '以下のURLをコピーしてください',
      saved: 'ショートカットを保存しました'
    }
  };

  /* 긴 표기부터 치환. 두 언어 표기를 모두 받는다. */
  var CHAR_KEYS = ['キャラクター','キャラ','캐릭터'];
  var OUT_KEYS  = ['コスチューム','衣装','의상'];
  var SIT_KEYS  = ['シチュエーション','シチュ','状況','상황'];

  function $(id){ return document.getElementById(id); }
  var tplEl = $('tpl'), charsEl = $('chars'), outsEl = $('outs'), sitsEl = $('sits');
  var board = $('board'), summary = $('summary');
  var missingBox = $('missingBox'), missingList = $('missingList'), missingSummary = $('missingSummary');

  /* items: 캐릭터 하나가 자기 상황/의상 목록을 들고 있는 평면 배열 */
  var state = { lang:'ko', tpl:'', groups:[], items:[], ci:null, oi:null, ran:false };
  var missing = new Map();
  var lightItems = [], lightIdx = 0;

  function T(){ return I18N[state.lang]; }
  function cur(){ return state.items[state.ci]; }

  /* ================= 언어 적용 ================= */
  function applyLang(){
    var t = T();
    document.documentElement.lang = state.lang;
    document.body.dataset.lang = state.lang;
    document.title = t.docTitle;

    Array.prototype.forEach.call(document.querySelectorAll('[data-t]'), function(el){ el.textContent = t[el.dataset.t]; });
    Array.prototype.forEach.call(document.querySelectorAll('[data-th]'), function(el){ el.innerHTML = t[el.dataset.th]; });
    Array.prototype.forEach.call(document.querySelectorAll('[data-ph]'), function(el){ el.placeholder = t[el.dataset.ph]; });
    Array.prototype.forEach.call(document.querySelectorAll('[data-ta]'), function(el){ el.setAttribute('aria-label', t[el.dataset.ta]); });

    $('langKo').setAttribute('aria-pressed', state.lang === 'ko');
    $('langJa').setAttribute('aria-pressed', state.lang === 'ja');

    renderSummary();
    renderMissing();
    paint();
  }

  function setLang(lang){
    state.lang = (lang === 'ja') ? 'ja' : 'ko';
    applyLang();
    syncUrl();
  }
  $('langKo').addEventListener('click', function(){ setLang('ko'); });
  $('langJa').addEventListener('click', function(){ setLang('ja'); });

  /* ================= 코드 확장 ================= */
  /* 구분자는 쉼표. 예전 링크 호환을 위해 ~ 도 계속 받는다. */
  function expand(raw){
    var out = [];
    (raw || '').split(/[,~]/).forEach(function(tok){
      var t = tok.trim();
      if (!t) return;
      var m = t.match(/^(.*?)(\d+)\.\.(\d+)$/);
      if (m){
        var prefix = m[1], pad = m[2].length;
        var a = parseInt(m[2],10), b = parseInt(m[3],10);
        var step = a <= b ? 1 : -1;
        for (var i=a; step>0 ? i<=b : i>=b; i+=step){
          out.push(prefix + String(i).padStart(pad,'0'));
        }
      } else out.push(t);
    });
    return Array.from(new Set(out));
  }

  /* ================= 그룹 파싱 =================
     "주요=1..7:1..21 ; 기타=8..11:22..26"
       ;  그룹 구분   =  그룹 이름   :  그 그룹 전용 상황 코드
     셋 다 없으면 예전과 동일하게 단일 그룹으로 동작한다. */
  function parseGroups(rawChars, rawOuts, globalSits){
    var outChunks = (rawOuts || '').split(';');
    var chunks = (rawChars || '').split(';');
    var groups = [];

    chunks.forEach(function(chunk, gi){
      chunk = chunk.trim();
      if (!chunk) return;

      var label = '';
      var eq = chunk.indexOf('=');
      if (eq !== -1){ label = chunk.slice(0, eq).trim(); chunk = chunk.slice(eq + 1); }

      var sitPart = null;
      var colon = chunk.indexOf(':');
      if (colon !== -1){ sitPart = chunk.slice(colon + 1); chunk = chunk.slice(0, colon); }

      var chars = expand(chunk);
      if (!chars.length) return;

      var sits = sitPart !== null ? expand(sitPart) : globalSits;
      /* 의상 칸도 ; 로 나눠 적으면 그룹 순서대로, 하나만 적으면 전체 공통 */
      var outRaw = outChunks.length > 1 ? (outChunks[gi] !== undefined ? outChunks[gi] : '') : (outChunks[0] || '');
      var outs = expand(outRaw);

      groups.push({ label: label, chars: chars, sits: sits, outs: outs });
    });

    return groups;
  }

  function flatten(groups){
    var items = [];
    groups.forEach(function(g, gi){
      g.start = items.length;
      g.chars.forEach(function(ch){
        items.push({ ch: ch, sits: g.sits, outs: g.outs, gi: gi });
      });
    });
    return items;
  }

  /* ================= URL 조립 ================= */
  function hasKey(s){
    return CHAR_KEYS.concat(OUT_KEYS, SIT_KEYS).some(function(k){ return s.indexOf(k) !== -1; });
  }
  function normalizeTpl(s){
    s = (s || '').trim();
    if (s.indexOf('%') !== -1){
      try { var d = decodeURIComponent(s); if (hasKey(d)) return d; } catch(e){}
    }
    return s;
  }
  function safeEncode(s){
    return s.replace(/[^\x00-\x7F]/g, function(c){ return encodeURIComponent(c); }).replace(/ /g,'%20');
  }
  function swap(s, keys, val){ keys.forEach(function(k){ s = s.split(k).join(val); }); return s; }
  function buildUrl(ch, co, si){
    var u = swap(state.tpl, CHAR_KEYS, ch);
    u = swap(u, OUT_KEYS, co || '');
    u = swap(u, SIT_KEYS, si);
    return safeEncode(u);
  }
  function labelOf(ch, co, si){ return [ch, co, si].filter(Boolean).join(' · '); }

  /* ================= 타일 ================= */
  function makeTile(url, code, sub, onOpen){
    var tile = document.createElement(onOpen ? 'button' : 'div');
    tile.className = 'tile' + (onOpen ? ' clickable' : '');
    if (onOpen) tile.type = 'button';

    var frame = document.createElement('div');
    frame.className = 'frame';
    var img = document.createElement('img');
    img.loading = 'lazy';
    img.alt = code;
    img.src = url;
    img.addEventListener('load', function(){ img.classList.add('shown'); });
    img.addEventListener('error', function(){
      missing.set(url, url); renderMissing();
      var tag = document.createElement('span');
      tag.className = 'gone';
      tag.textContent = T().gone;
      frame.appendChild(tag);
      img.remove();
    });
    frame.appendChild(img);

    var cap = document.createElement('div');
    cap.className = 'cap';
    var c = document.createElement('span'); c.className = 'code'; c.textContent = code;
    cap.appendChild(c);
    if (sub){ var n = document.createElement('span'); n.className='n'; n.textContent = sub; cap.appendChild(n); }

    tile.appendChild(frame); tile.appendChild(cap);
    if (onOpen) tile.addEventListener('click', onOpen);
    return tile;
  }

  function renderMissing(){
    var n = missing.size;
    missingBox.style.display = n ? 'block' : 'none';
    missingSummary.textContent = T().missing(n);
    missingList.innerHTML = '';
    missing.forEach(function(_, url){
      var li = document.createElement('li');
      li.textContent = decodeURI(url);
      missingList.appendChild(li);
    });
  }

  /* ================= 화면 ================= */
  function renderSummary(){
    if (!state.items.length){ summary.className = 'summary'; summary.innerHTML = ''; return; }
    var total = 0;
    state.items.forEach(function(it){ total += (it.outs.length || 1) * it.sits.length; });
    summary.className = 'summary on';
    summary.innerHTML = T().summary(state.items.length, state.groups.length, total);
  }

  function bar(backLabel, titleText, tagText, onBack){
    var b = document.createElement('div');
    b.className = 'detailbar';
    var back = document.createElement('button');
    back.className = 'btn-ghost'; back.textContent = backLabel;
    back.addEventListener('click', onBack);
    var h = document.createElement('h2'); h.textContent = titleText;
    b.appendChild(back); b.appendChild(h);
    if (tagText){
      var tag = document.createElement('span');
      tag.className = 'tag'; tag.textContent = tagText;
      b.appendChild(tag);
    }
    return b;
  }

  /* 1단계 — 캐릭터 (그룹별 섹션) */
  function renderChars(){
    board.innerHTML = '';
    if (!state.items.length){
      board.innerHTML = '<div class="empty">' + T().emptyCodes + '</div>';
      return;
    }
    var multi = state.groups.length > 1;

    state.groups.forEach(function(g, gi){
      if (!g.sits.length) return;
      var sec = document.createElement('section');
      sec.className = 'section';

      if (multi || g.label){
        var head = document.createElement('div');
        head.className = 'sectionhead';
        var h3 = document.createElement('h3');
        h3.textContent = g.label || T().groupN(gi + 1);
        var meta = document.createElement('span');
        meta.className = 'meta';
        meta.textContent = T().secMeta(g.chars.length, g.sits.length);
        head.appendChild(h3); head.appendChild(meta);
        sec.appendChild(head);
      }

      var grid = document.createElement('div');
      grid.className = 'grid';
      g.chars.forEach(function(ch, k){
        var idx = g.start + k;
        var url = buildUrl(ch, g.outs[0] || '', g.sits[0]);
        var sub = g.outs.length ? T().subOut(g.outs.length) : T().subSit(g.sits.length);
        grid.appendChild(makeTile(url, ch, sub, function(){ goChar(idx); }));
      });
      sec.appendChild(grid);
      board.appendChild(sec);
    });
  }

  /* 2단계 — 의상 */
  function renderOuts(){
    var it = cur();
    var gLabel = state.groups.length > 1 ? (state.groups[it.gi].label || T().groupN(it.gi + 1)) : '';
    board.innerHTML = '';
    board.appendChild(bar(T().back, it.ch, gLabel, goRoot));

    var grid = document.createElement('div');
    grid.className = 'grid';
    it.outs.forEach(function(co, k){
      var url = buildUrl(it.ch, co, it.sits[0]);
      grid.appendChild(makeTile(url, co, T().subSit(it.sits.length), function(){ goOut(k); }));
    });
    board.appendChild(grid);
  }

  /* 3단계 — 상황 */
  function renderSits(){
    var it = cur();
    var co = it.outs.length ? it.outs[state.oi] : '';
    var gLabel = state.groups.length > 1 ? (state.groups[it.gi].label || T().groupN(it.gi + 1)) : '';
    var ci = state.ci;
    board.innerHTML = '';
    board.appendChild(bar(
      it.outs.length ? T().backChar : T().back,
      labelOf(it.ch, co, ''),
      gLabel,
      it.outs.length ? function(){ goChar(ci); } : goRoot
    ));

    var grid = document.createElement('div');
    grid.className = 'grid';
    var items = [];
    it.sits.forEach(function(si, k){
      var url = buildUrl(it.ch, co, si);
      items.push({ url: url, label: labelOf(it.ch, co, si) });
      grid.appendChild(makeTile(url, si, '', function(){ openLight(items, k); }));
    });
    board.appendChild(grid);
  }

  function paint(){
    if (!state.ran){ board.innerHTML = '<div class="empty">' + T().emptyStart + '</div>'; return; }
    if (state.ci === null || !cur()) renderChars();
    else if (cur().outs.length && state.oi === null) renderOuts();
    else renderSits();
  }

  function goRoot(){ state.ci = null; state.oi = null; syncUrl(); paint(); }
  function goChar(i){
    state.ci = i;
    state.oi = state.items[i].outs.length ? null : 0;
    syncUrl(); paint();
    window.scrollTo({ top:0, behavior:'smooth' });
  }
  function goOut(k){ state.oi = k; syncUrl(); paint(); window.scrollTo({ top:0, behavior:'smooth' }); }

  /* ================= 원본 보기 ================= */
  var light = $('light'), lightImg = $('lightImg'), lightMeta = $('lightMeta');
  function openLight(items, idx){ lightItems = items; lightIdx = idx; showLight(); light.classList.add('on'); }
  function showLight(){
    var it = lightItems[lightIdx];
    lightImg.src = it.url;
    lightMeta.textContent = it.label + '  —  ' + decodeURI(it.url);
  }
  function step(d){
    if (!lightItems.length) return;
    lightIdx = (lightIdx + d + lightItems.length) % lightItems.length;
    showLight();
  }
  $('prev').addEventListener('click', function(){ step(-1); });
  $('next').addEventListener('click', function(){ step(1); });
  $('lightClose').addEventListener('click', function(){ light.classList.remove('on'); });
  light.addEventListener('click', function(e){ if (e.target === light) light.classList.remove('on'); });
  document.addEventListener('keydown', function(e){
    if (!light.classList.contains('on')) return;
    if (e.key === 'Escape') light.classList.remove('on');
    if (e.key === 'ArrowLeft') step(-1);
    if (e.key === 'ArrowRight') step(1);
  });

  /* ================= URL 상태 ================= */
  function syncUrl(){
    var p = new URLSearchParams();
    p.set('lang', state.lang);
    if (tplEl.value.trim()) p.set('t', tplEl.value.trim());
    if (charsEl.value.trim()) p.set('c', charsEl.value.trim());
    if (outsEl.value.trim()) p.set('o', outsEl.value.trim());
    if (sitsEl.value.trim()) p.set('s', sitsEl.value.trim());
    if (state.ci !== null) p.set('ci', String(state.ci));
    if (state.ci !== null && state.oi !== null && cur() && cur().outs.length) p.set('oi', String(state.oi));
    history.replaceState(null, '', location.pathname + '?' + p.toString());
    $('copy').disabled = !state.items.length;
    $('dl').disabled = !state.items.length;
  }

  function run(keep){
    state.tpl = normalizeTpl(tplEl.value);
    tplEl.value = state.tpl;

    var globalSits = expand(sitsEl.value);
    state.groups = parseGroups(charsEl.value, outsEl.value, globalSits);
    state.items = flatten(state.groups);
    state.ran = true;
    missing.clear(); renderMissing();

    if (!keep || state.ci === null || state.ci >= state.items.length){ state.ci = null; state.oi = null; }
    else if (!state.items[state.ci].outs.length) state.oi = 0;
    else if (state.oi !== null && state.oi >= state.items[state.ci].outs.length) state.oi = null;

    renderSummary(); syncUrl(); paint();
  }

  $('run').addEventListener('click', function(){ run(false); });
  [tplEl, charsEl, outsEl, sitsEl].forEach(function(el){
    el.addEventListener('keydown', function(e){ if (e.key === 'Enter') run(false); });
  });

  /* ================= 복사 / 바로가기 ================= */
  function toast(msg){
    var t = $('toast'); t.textContent = msg; t.classList.add('on');
    setTimeout(function(){ t.classList.remove('on'); }, 1600);
  }
  $('copy').addEventListener('click', function(){
    var url = location.href;
    if (navigator.clipboard) navigator.clipboard.writeText(url).then(function(){ toast(T().copied); }, function(){ toast(T().copyFail); });
    else prompt(T().copyPrompt, url);
  });
  $('dl').addEventListener('click', function(){
    var url = location.href;
    var html = '<!DOCTYPE HTML>\n<meta charset="UTF-8">\n<meta http-equiv="refresh" content="0; url=' + url + '">\n<script>\n  window.location.href = ' + JSON.stringify(url) + ';\n<\/script>\n';
    var blob = new Blob([html], { type:'text/html' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'preview-' + state.lang + '.html';
    a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
    toast(T().saved);
  });

  /* ================= 초기화 ================= */
  (function init(){
    var p = new URLSearchParams(location.search);
    var q = (p.get('lang') || '').toLowerCase();
    if (q === 'ja' || q === 'jp') state.lang = 'ja';
    else if (q === 'ko' || q === 'kr') state.lang = 'ko';
    else state.lang = (navigator.language || '').toLowerCase().indexOf('ja') === 0 ? 'ja' : 'ko';

    tplEl.value = p.get('t') || '';
    charsEl.value = p.get('c') || '';
    outsEl.value = p.get('o') || '';
    sitsEl.value = p.get('s') || '';

    applyLang();

    if (tplEl.value && charsEl.value && (sitsEl.value || charsEl.value.indexOf(':') !== -1)){
      var ci = p.get('ci'), oi = p.get('oi');
      state.ci = ci !== null ? parseInt(ci,10) : null;
      state.oi = oi !== null ? parseInt(oi,10) : null;
      run(true);
    } else {
      syncUrl();
    }
  })();
})();
</script>
</body>
</html>
